[wokwi]
version = 1
firmware = '.pio/build/esp32s3/firmware.merged.bin'
elf = '.pio/build/esp32s3/firmware.elf'
data = 'data'
env = '.env'

[esp32]
flash_size = "16MB"
paramType = {
  "type": "board-esp32-s3-devkitc-1",
  "id": "esp",
  "top": 0,
  "left": 0,
  "attrs": { "flashSize": "16", "psramType": "octal" }
}