; PlatformIO project: BMS Door Simulator (ESP32-S3)
; Simulates a door device as it would appear in a Siemens Building X BMS.
; Serves the Building X Operations API surface locally (no cloud connection).

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7

; Enable LittleFS for environment file storage
board_build.filesystem = littlefs
board_build.partitions = app3M_spiffs9M_fact512k_16MB.csv
board_build.flash_size = 16MB
extra_scripts = post:merge_firmware.py
lib_ignore =
    data